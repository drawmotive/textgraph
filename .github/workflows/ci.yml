name: Package contracts
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
permissions:
  contents: read
jobs:
  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm pack --json
      - uses: actions/upload-artifact@v4
        with:
          name: textgraph-npm-${{ matrix.os }}-node-${{ matrix.node }}
          path: "*.tgz"
          if-no-files-found: error
      - run: node samples/prepare.mjs node
      - run: npm run test:samples:node
      - name: Check React 18 compatibility
        run: |
          npm install --no-save --package-lock=false react@18.2.0 react-dom@18.2.0
          node --test --test-concurrency=1 test/react.test.mjs
  fonts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ["22"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: language-packs
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: language-packs/package-lock.json
      - run: npm ci --workspaces=false
      - run: npm test
      - run: npm run build
      - run: npm pack --json
      - uses: actions/upload-artifact@v4
        with:
          name: textgraph-fonts-npm-${{ matrix.os }}-node-${{ matrix.node }}
          path: language-packs/*.tgz
          if-no-files-found: error
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - run: npm run test:samples
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-failures
          path: test-results/
